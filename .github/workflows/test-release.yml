name: Test Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish to TestPyPI (must match sshvault.__version__)"
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify version matches the package
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          PKG_VERSION=$(grep -oP '__version__ = "\K[^"]+' src/sshvault/__init__.py)
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Input version $VERSION does not match __version__ $PKG_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
