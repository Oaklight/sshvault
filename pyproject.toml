[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sshvault"
dynamic = ["version"]
authors = [{ name = "Peng Ding", email = "pding.dp@foxmail.com" }]
description = "Back up and restore SSH keys and SSH config files with Bitwarden"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
  "ssh",
  "bitwarden",
  "ssh-keys",
  "ssh-config",
  "backup",
  "secrets",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.15.20",
  "ty==0.0.54",
  "pre-commit",
  "build",
  "twine",
]
test = ["pytest>=7.0.0"]

[project.scripts]
sshvault = "sshvault.cli:main"

[project.urls]
Repository = "https://github.com/Oaklight/sshvault"
Issues = "https://github.com/Oaklight/sshvault/issues"
Changelog = "https://github.com/Oaklight/sshvault/releases"

[tool.setuptools.dynamic]
version = { attr = "sshvault.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
